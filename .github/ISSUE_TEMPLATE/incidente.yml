name: Reporte de incidente
description: Registrar un incidente técnico del proyecto Angular
title: "INC-"
labels: ["tipo: bug", "estado: nuevo"]
body:
  - type: input
    id: codigo
    attributes:
      label: Código del incidente
      placeholder: INC-001
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: resultado_esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: resultado_actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options: [Baja, Media, Alta, Crítica]
    validations:
      required: true
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo afectado
      options: [Dashboard, Formulario, Lista, Detalle, Servicio, Rutas, Interfaz]
    validations:
      required: true
  - type: textarea
    id: criterio_cierre
    attributes:
      label: Criterio de cierre
    validations:
      required: true
